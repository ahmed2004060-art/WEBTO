plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
android {
    namespace "com.webto"
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    defaultConfig {
        applicationId "com.webto"
        minSdk 24
        targetSdk 34
        // versionCode يزيد تلقائياً مع كل بناء في GitHub Actions حتى يُقبل التحديث فوق النسخة المثبتة
        def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionCode 1 + runNo
        versionName "0.1." + runNo
    }
    // مفتاح توقيع ثابت داخل المشروع (يمكن تجاوزه بأسرار GitHub إن وُجدت)
    def ksFile = System.getenv("KEYSTORE_FILE") ?: "webto.keystore"
    def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: "80ba95aeb967af51798ff31c"
    signingConfigs {
        shared {
            storeFile file(ksFile)
            storePassword ksPass
            keyAlias "webto"
            keyPassword ksPass
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared }
    }
}
dependencies {
}
